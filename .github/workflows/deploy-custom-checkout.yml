name: Deploy Custom Checkout
on: repository_dispatch

env:
  DEPLOYMENT_VERSION: ${{ github.event.client_payload.version }}
  DEPLOYMENT_BRANCH:  "release-v-${{ github.event.client_payload.version }}"
  SOURCE_RUN_ID:      ${{ github.event.client_payload.run_id }}

jobs:
  receive-and-release:
    if: ${{ github.event.action == 'deploy_custom_xcframework' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pod repo
        uses: actions/checkout@v4

      - name: Download XCFramework from razorpay-ios
        uses: actions/download-artifact@v4
        with:
          name: "xcframework-custom-v${{ env.DEPLOYMENT_VERSION }}"
          path: ./xcframework-download
          github-token: ${{ secrets.CI_BOT_TOKEN }}
          repository: razorpay/razorpay-ios
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Replace XCFramework in Pod/
        run: |
          rm -rf ./Pod/RazorpayCustom.xcframework
          cp -R ./xcframework-download/RazorpayCustom.xcframework ./Pod/RazorpayCustom.xcframework
          echo "✅ Replaced RazorpayCustom.xcframework"

      - name: Bump podspec version
        run: |
          chmod +x ./.github/scripts/update_podspec_version.sh
          ./.github/scripts/update_podspec_version.sh "${{ env.DEPLOYMENT_VERSION }}"
          grep "s.version" razorpay-customui-pod.podspec

      - name: Commit release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ env.DEPLOYMENT_BRANCH }}"
          git add ./Pod razorpay-customui-pod.podspec
          git commit -m "release: v${{ env.DEPLOYMENT_VERSION }}"
          git push origin "${{ env.DEPLOYMENT_BRANCH }}"

      - name: Open PR to master
        env:
          GH_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "v_${{ env.DEPLOYMENT_VERSION }}_release" \
            --body "Custom Checkout SDK v${{ env.DEPLOYMENT_VERSION }} — pre-built xcframework from razorpay-ios.

          **BrowserStack build:** ${{ github.event.client_payload.bs_build_id }}
          **Dashboard:** ${{ github.event.client_payload.bs_dashboard }}
          **Source run:** https://github.com/razorpay/razorpay-ios/actions/runs/${{ env.SOURCE_RUN_ID }}

          Merging this PR triggers \`release-to-cocoapods.yml\` (tag + GitHub release + pod trunk push)." \
            --base master \
            --head "${{ env.DEPLOYMENT_BRANCH }}")
          echo "✅ PR opened: $PR_URL"
