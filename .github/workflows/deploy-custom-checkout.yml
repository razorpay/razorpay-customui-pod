# ─────────────────────────────────────────────────────────────────────────────
# Deploy Custom Checkout
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Custom Checkout

on:
  repository_dispatch:
    types: [deploy_custom_xcframework]
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-custom-checkout-${{ github.event.pull_request.number || github.event.client_payload.version || github.run_id }}
  cancel-in-progress: false

jobs:
# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Deploy custom checkout (download release artifact, open PR)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-custom:
    name: Deploy custom checkout
    if: github.event_name == 'repository_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20

    env:
      DEPLOYMENT_VERSION: ${{ github.event.client_payload.version }}
      IS_RC: ${{ github.event.client_payload.is_rc }}
      CORE_CHANGED: ${{ github.event.client_payload.core_changed }}
      CORE_VERSION_HINT: ${{ github.event.client_payload.core_version || '' }}
      ARTIFACT_REPOSITORY: ${{ github.event.client_payload.source_repo }}
      ARTIFACT_RUN_ID: ${{ github.event.client_payload.run_id }}
      SDK_ARTIFACT: ${{ github.event.client_payload.artifacts.sdk }}
      CHECKSUM_SDK: ${{ github.event.client_payload.checksums.sdk }}

    steps:
      - name: Checkout master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          token: ${{ secrets.CI_BOT_TOKEN }}
          fetch-depth: 0

      - name: Validate dispatch payload
        run: |
          set -eo pipefail

          REQUIRED_VARS=(
            DEPLOYMENT_VERSION
            ARTIFACT_REPOSITORY
            ARTIFACT_RUN_ID
            SDK_ARTIFACT
            CHECKSUM_SDK
          )

          for var_name in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "❌ Missing required payload field: ${var_name}"
              exit 1
            fi
          done

      - name: Block deployment until core dependency release is ready
        if: env.CORE_CHANGED == 'true'
        run: |
          set -eo pipefail

          echo "❌ This workflow does not publish core artifacts."
          if [ -n "${CORE_VERSION_HINT}" ]; then
            echo "   Release the required core dependency version ${CORE_VERSION_HINT} first, then rerun this workflow."
          else
            echo "   Release the required core dependency first, then rerun this workflow."
          fi
          exit 1

      - name: Create or reuse release branch
        run: |
          set -eo pipefail

          RELEASE_BRANCH="release/v${DEPLOYMENT_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "${RELEASE_BRANCH}:${RELEASE_BRANCH}" 2>/dev/null || true

          if git show-ref --verify --quiet "refs/heads/${RELEASE_BRANCH}"; then
            git checkout "${RELEASE_BRANCH}"
          else
            git checkout -b "${RELEASE_BRANCH}"
          fi

      - name: Download SDK XCFramework zip artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ secrets.CI_BOT_TOKEN }}
          repository: ${{ env.ARTIFACT_REPOSITORY }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          name: ${{ env.SDK_ARTIFACT }}
          path: /tmp/artifacts/sdk

      - name: Verify and unzip XCFramework artifacts
        run: |
          set -eo pipefail

          SDK_ARCHIVE=$(find /tmp/artifacts/sdk -name "sdk-xcframework.zip" -type f | head -1)

          if [ -z "$SDK_ARCHIVE" ]; then
            echo "❌ Missing required SDK zip artifact"
            exit 1
          fi

          ACTUAL_SDK_SHA=$(shasum -a 256 "$SDK_ARCHIVE" | awk '{print $1}')
          if [ "$ACTUAL_SDK_SHA" != "${CHECKSUM_SDK}" ]; then
            echo "❌ CHECKSUM MISMATCH for SDK"
            echo "   Expected: ${CHECKSUM_SDK}"
            echo "   Actual:   ${ACTUAL_SDK_SHA}"
            exit 1
          fi

          mkdir -p /tmp/sdk-artifact
          unzip -q "$SDK_ARCHIVE" -d /tmp/sdk-artifact

      - name: Replace custom xcframework
        run: |
          set -eo pipefail

          rm -rf Pod/RazorpayCustom.xcframework

          SDK_XCFW=$(find /tmp/sdk-artifact -name "RazorpayCustom.xcframework" -type d | head -1)
          if [ -z "$SDK_XCFW" ]; then
            echo "❌ RazorpayCustom.xcframework not found in artifact"
            find /tmp/sdk-artifact -type d -name "*.xcframework"
            exit 1
          fi

          cp -R "$SDK_XCFW" Pod/RazorpayCustom.xcframework
          echo "✅ Pod/RazorpayCustom.xcframework replaced"

      - name: Resolve target core version
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          set -eo pipefail

          normalize_version() {
            printf '%s' "$1" | sed -E 's/^core-//; s/^v//'
          }

          RELEASES_RESPONSE=$(curl --silent --show-error --fail \
            -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/razorpay/razorpay-customui-pod/releases?per_page=100")

          LATEST_CORE_TAG=$(printf '%s\n' "${RELEASES_RESPONSE}" | jq -r 'map(select(.draft == false and (.tag_name | startswith("core-")))) | .[0].tag_name // empty')
          if [ -z "${LATEST_CORE_TAG}" ]; then
            TAGS_RESPONSE=$(curl --silent --show-error --fail \
              -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/razorpay/razorpay-customui-pod/tags?per_page=100")
            LATEST_CORE_TAG=$(printf '%s\n' "${TAGS_RESPONSE}" | jq -r 'map(select(.name | startswith("core-"))) | .[0].name // empty')
          fi

          if [ -z "${LATEST_CORE_TAG}" ]; then
            echo "❌ Failed to resolve the latest released core dependency tag."
            exit 1
          fi

          TARGET_CORE_VERSION=$(normalize_version "${LATEST_CORE_TAG}")
          if ! printf '%s\n' "${TARGET_CORE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "❌ Could not normalize a dependency version from tag ${LATEST_CORE_TAG}."
            exit 1
          fi

          LOCAL_CORE_VERSION=$(grep -m1 "s\.version" razorpay-core-pod.podspec | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ "'"'"']*' | head -1)
          if [ -z "${LOCAL_CORE_VERSION}" ]; then
            echo "❌ Failed to read the local core dependency version."
            exit 1
          fi

          echo "LOCAL_CORE_VERSION=${LOCAL_CORE_VERSION}" >> "$GITHUB_ENV"
          echo "TARGET_CORE_VERSION=${TARGET_CORE_VERSION}" >> "$GITHUB_ENV"

          echo "✅ Latest released core dependency tag: ${LATEST_CORE_TAG}"
          echo "✅ Using core dependency version: ${TARGET_CORE_VERSION}"
          if [ "${LOCAL_CORE_VERSION}" = "${TARGET_CORE_VERSION}" ]; then
            echo "✅ Local core dependency mirror already matches ${TARGET_CORE_VERSION}"
          else
            echo "ℹ️ Local core dependency mirror is ${LOCAL_CORE_VERSION}; it will be updated to ${TARGET_CORE_VERSION} in this release branch."
          fi

      - name: Prepare release files
        run: |
          set -eo pipefail

          chmod +x .github/scripts/update_podspec_version.sh
          ./.github/scripts/update_podspec_version.sh "${DEPLOYMENT_VERSION}"
          echo "✅ razorpay-customui-pod.podspec → v${DEPLOYMENT_VERSION}"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          target_core_version = os.environ["TARGET_CORE_VERSION"]
          path = Path("razorpay-core-pod.podspec")
          text = path.read_text()
          updated = re.sub(
              r"^(\s*s\.version\s*=\s*)'[^']+'",
              rf"\1'{target_core_version}'",
              text,
              count=1,
              flags=re.M,
          )
          if updated == text:
              raise SystemExit("Could not update razorpay-core-pod.podspec version")
          path.write_text(updated)
          PY

          echo "✅ razorpay-core-pod.podspec mirror synced to v${TARGET_CORE_VERSION}"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          target_core_version = os.environ["TARGET_CORE_VERSION"]
          path = Path("razorpay-customui-pod.podspec")
          text = path.read_text()
          dependency_line = f"  s.dependency 'razorpay-core-pod', '~> {target_core_version}'\n"

          if "s.dependency 'razorpay-core-pod'" in text:
              text = re.sub(
                  r"^[ \t]*s\.dependency 'razorpay-core-pod'.*$",
                  dependency_line.rstrip("\n"),
                  text,
                  flags=re.M,
              )
          else:
              needle = "s.vendored_frameworks = ['Pod/RazorpayCustom.xcframework']\n"
              if needle not in text:
                  raise SystemExit("Could not locate vendored_frameworks line in razorpay-customui-pod.podspec")
              text = text.replace(needle, needle + dependency_line, 1)

          path.write_text(text)
          PY

          echo "✅ Podspec dependency updated to core version ~> ${TARGET_CORE_VERSION}"

      - name: Refresh Example app pods
        run: |
          set -eo pipefail

          cat > Example/Podfile <<'PODFILE'
          use_frameworks!

          platform :ios, '11.0'

          target 'razorpay-customui-pod_Example' do
            pod 'razorpay-customui-pod', :path=>'../'
            pod 'razorpay-core-pod', :path=>'../'
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['EXCLUDED_ARCHS[sdk=iphonesimulator*]'] = 'arm64'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '11.0'
              end
            end
          end
          PODFILE

          rm -rf Example/Pods Example/Podfile.lock
          (cd Example && pod install --no-repo-update)
          echo "✅ Example Podfile, Podfile.lock and Pods refreshed for local customui/core usage"

      - name: Commit and push
        run: |
          set -eo pipefail

          RELEASE_BRANCH="release/v${DEPLOYMENT_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Pod/RazorpayCustom.xcframework razorpay-core-pod.podspec razorpay-customui-pod.podspec Example/Podfile Example/Podfile.lock Example/Pods

          if git diff --cached --quiet; then
            echo "No release asset changes to commit"
            exit 0
          fi

          git commit -m "chore: release customui:${DEPLOYMENT_VERSION} against core:${TARGET_CORE_VERSION}"
          git push origin "${RELEASE_BRANCH}"

      - name: Create pull request
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          set -eo pipefail

          RELEASE_BRANCH="release/v${DEPLOYMENT_VERSION}"

          PR_BODY=$(cat <<EOF_BODY
          ## Custom Checkout v${DEPLOYMENT_VERSION}

          ### Updated frameworks
          - Updated \`Pod/RazorpayCustom.xcframework\`
          - Refreshed \`Example/Podfile\`, \`Example/Podfile.lock\`, and \`Example/Pods\` for local customui/core usage
          - CustomUI release version: \`${DEPLOYMENT_VERSION}\`
          - Core pod mirror version: \`${TARGET_CORE_VERSION}\`
          - Core pod dependency version: \`${TARGET_CORE_VERSION}\`
          - Core dependency is aligned with the latest released core tag

          ---
          Opened automatically by CI.
          EOF_BODY
          )

          HTTP_STATUS=$(curl --silent --output /tmp/pr_response.json --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/razorpay/razorpay-customui-pod/pulls" \
            -d "$(jq -n \
              --arg title "release: v${DEPLOYMENT_VERSION}" \
              --arg body "$PR_BODY" \
              --arg head "$RELEASE_BRANCH" \
              --arg base "master" \
              '{title: $title, body: $body, head: $head, base: $base}')")

          if [ "$HTTP_STATUS" -eq 201 ]; then
            PR_URL=$(jq -r '.html_url' /tmp/pr_response.json)
            echo "✅ PR created: ${PR_URL}"
          elif [ "$HTTP_STATUS" -eq 422 ]; then
            echo "⚠️  PR already exists (HTTP 422)"
            jq -r '.errors[0].message // .message' /tmp/pr_response.json
          else
            echo "❌ Failed to create PR (HTTP ${HTTP_STATUS})"
            cat /tmp/pr_response.json
            exit 1
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Deploy Custom Checkout v${DEPLOYMENT_VERSION}"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Version | \`${DEPLOYMENT_VERSION}\` |"
            echo "| RC | ${IS_RC} |"
            echo "| RazorpayCustom.xcframework | ✅ replaced |"
            echo "| Razorpay.xcframework (Wrapper) | — unchanged |"
            echo "| razorpay-core-pod dependency | \`${TARGET_CORE_VERSION}\` |"
            echo "| PR | opened to master |"
          } >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — On PR merge to master: tag, release, publish
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Tag, release, and publish
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      startsWith(github.event.pull_request.title, 'release: v') &&
      contains(github.event.pull_request.body || '', 'Opened automatically by CI.')
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout merged release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.CI_BOT_TOKEN }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Detect release state
        id: detect
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          set -eo pipefail

          CUSTOMUI_VERSION=$(grep -m1 "s\.version" razorpay-customui-pod.podspec | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ "'"'"']*' | head -1)
          CORE_DEPENDENCY_VERSION=$(grep -m1 "s\.dependency 'razorpay-core-pod'" razorpay-customui-pod.podspec | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ "'"'"']*' | head -1)
          CUSTOMUI_TAG="${CUSTOMUI_VERSION}"

          if [ -z "${CORE_DEPENDENCY_VERSION}" ]; then
            echo "❌ The podspec is missing the required core dependency version."
            exit 1
          fi

          {
            echo "customui_version=${CUSTOMUI_VERSION}"
            echo "core_dependency_version=${CORE_DEPENDENCY_VERSION}"
            echo "customui_tag=${CUSTOMUI_TAG}"
          } >> "$GITHUB_OUTPUT"

          git fetch --force --tags origin

          if git ls-remote --exit-code --tags origin "refs/tags/${CUSTOMUI_TAG}" >/dev/null; then
            CUSTOMUI_TAG_EXISTS="true"
          else
            CUSTOMUI_TAG_EXISTS="false"
          fi

          RESPONSE_FILE="/tmp/customui_release.json"
          HTTP_STATUS=$(curl --silent --output "${RESPONSE_FILE}" --write-out "%{http_code}" \
            -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/razorpay/razorpay-customui-pod/releases/tags/${CUSTOMUI_TAG}")

          if [ "${HTTP_STATUS}" -eq 200 ]; then
            CUSTOMUI_RELEASE_EXISTS="true"
            CUSTOMUI_RELEASE_URL=$(jq -r '.html_url' "${RESPONSE_FILE}")
            {
              echo "customui_release_exists=true"
              echo "customui_release_url=${CUSTOMUI_RELEASE_URL}"
            } >> "$GITHUB_OUTPUT"
          elif [ "${HTTP_STATUS}" -eq 404 ]; then
            CUSTOMUI_RELEASE_EXISTS="false"
            {
              echo "customui_release_exists=false"
              echo "customui_release_url="
            } >> "$GITHUB_OUTPUT"
          else
            echo "❌ Failed to read customui release state (HTTP ${HTTP_STATUS})"
            cat "${RESPONSE_FILE}"
            exit 1
          fi

          CORE_INFO=$(pod trunk info razorpay-core-pod 2>/dev/null || true)
          if printf '%s\n' "${CORE_INFO}" | grep -Eq "(^|[[:space:]])${CORE_DEPENDENCY_VERSION}([[:space:]]|$)"; then
            CORE_DEPENDENCY_AVAILABLE="true"
          else
            CORE_DEPENDENCY_AVAILABLE="false"
          fi

          CUSTOM_INFO=$(pod trunk info razorpay-customui-pod 2>/dev/null || true)
          if printf '%s\n' "${CUSTOM_INFO}" | grep -Eq "(^|[[:space:]])${CUSTOMUI_VERSION}([[:space:]]|$)"; then
            CUSTOMUI_PUBLISHED="true"
          else
            CUSTOMUI_PUBLISHED="false"
          fi

          {
            echo "customui_tag_exists=${CUSTOMUI_TAG_EXISTS}"
            echo "core_dependency_available=${CORE_DEPENDENCY_AVAILABLE}"
            echo "customui_published=${CUSTOMUI_PUBLISHED}"
          } >> "$GITHUB_OUTPUT"

          if [ "${CUSTOMUI_RELEASE_EXISTS}" = "true" ] && [ "${CUSTOMUI_TAG_EXISTS}" != "true" ]; then
            echo "❌ CustomUI GitHub release ${CUSTOMUI_TAG} exists, but the tag is missing remotely."
            exit 1
          fi

          if [ "${CUSTOMUI_PUBLISHED}" = "true" ] && [ "${CUSTOMUI_TAG_EXISTS}" != "true" ]; then
            echo "❌ CustomUI pod ${CUSTOMUI_VERSION} is published but tag ${CUSTOMUI_TAG} is missing."
            exit 1
          fi

          if [ "${CUSTOMUI_PUBLISHED}" = "true" ] && [ "${CUSTOMUI_RELEASE_EXISTS}" != "true" ]; then
            echo "❌ CustomUI pod ${CUSTOMUI_VERSION} is published but GitHub release ${CUSTOMUI_TAG} is missing."
            exit 1
          fi

          if [ "${CUSTOMUI_PUBLISHED}" = "true" ] && [ "${CORE_DEPENDENCY_AVAILABLE}" != "true" ]; then
            echo "❌ CustomUI pod ${CUSTOMUI_VERSION} is published but required core pod ${CORE_DEPENDENCY_VERSION} is not available on CocoaPods trunk."
            exit 1
          fi

          if [ "${CORE_DEPENDENCY_AVAILABLE}" != "true" ]; then
            echo "❌ Required core dependency version ${CORE_DEPENDENCY_VERSION} is not available on CocoaPods trunk."
            echo "   Publish the matching core dependency release first, then rerun this workflow."
            exit 1
          fi

          echo "── Detected ──"
          echo "  Custom UI: v${CUSTOMUI_VERSION}"
          echo "  Core dependency version: ${CORE_DEPENDENCY_VERSION}"
          echo "  Core dependency available on trunk: ${CORE_DEPENDENCY_AVAILABLE}"
          echo "  Custom tag: ${CUSTOMUI_TAG_EXISTS}"
          echo "  Custom release: ${CUSTOMUI_RELEASE_EXISTS}"
          echo "  Custom pod: ${CUSTOMUI_PUBLISHED}"

      - name: Tag custom checkout
        if: steps.detect.outputs.customui_tag_exists != 'true'
        env:
          VERSION: ${{ steps.detect.outputs.customui_version }}
          TAG_NAME: ${{ steps.detect.outputs.customui_tag }}
        run: |
          set -eo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Release Custom Checkout ${VERSION}"
          git push origin "${TAG_NAME}"
          echo "✅ Tagged ${TAG_NAME}"

      - name: Create custom checkout GitHub Release
        if: steps.detect.outputs.customui_release_exists != 'true'
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          VERSION: ${{ steps.detect.outputs.customui_version }}
          TAG_NAME: ${{ steps.detect.outputs.customui_tag }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -eo pipefail

          IS_PRERELEASE="false"
          if [[ "${VERSION}" == *"-rc"* ]]; then
            IS_PRERELEASE="true"
          fi

          HTTP_STATUS=$(curl --silent --output /tmp/customui_release.json --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/razorpay/razorpay-customui-pod/releases" \
            -d "$(jq -n \
              --arg tag_name "${TAG_NAME}" \
              --arg name "Custom Checkout ${VERSION}" \
              --arg target "${MERGE_COMMIT_SHA}" \
              --argjson prerelease ${IS_PRERELEASE} \
              --argjson generate_release_notes true \
              '{tag_name: $tag_name, name: $name, target_commitish: $target, prerelease: $prerelease, generate_release_notes: $generate_release_notes}')")

          if [ "$HTTP_STATUS" -eq 201 ]; then
            echo "✅ Custom Checkout GitHub Release created"
          elif [ "$HTTP_STATUS" -eq 422 ]; then
            echo "⚠️  Custom Checkout release already exists"
          else
            echo "❌ Failed to create custom checkout release (HTTP ${HTTP_STATUS})"
            cat /tmp/customui_release.json
            exit 1
          fi

      - name: Publish custom checkout to CocoaPods
        if: steps.detect.outputs.customui_published != 'true'
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          VERSION: ${{ steps.detect.outputs.customui_version }}
        run: |
          set -eo pipefail

          pod lib lint razorpay-customui-pod.podspec --allow-warnings
          pod trunk push razorpay-customui-pod.podspec --allow-warnings

      - name: Job summary
        if: always()
        env:
          CORE_DEPENDENCY_VERSION_OUTPUT: ${{ steps.detect.outputs.core_dependency_version }}
          CUSTOMUI_VERSION_OUTPUT: ${{ steps.detect.outputs.customui_version }}
          CUSTOMUI_PUBLISHED_OUTPUT: ${{ steps.detect.outputs.customui_published }}
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Core dependency | \`${CORE_DEPENDENCY_VERSION_OUTPUT}\` verified on CocoaPods trunk |"

            CUSTOMUI_VERSION="${CUSTOMUI_VERSION_OUTPUT}"
            if [ "${CUSTOMUI_PUBLISHED_OUTPUT}" = "true" ]; then
              echo "| razorpay-customui-pod | \`${CUSTOMUI_VERSION}\` already published |"
            else
              echo "| razorpay-customui-pod | \`${CUSTOMUI_VERSION}\` tagged + published |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
