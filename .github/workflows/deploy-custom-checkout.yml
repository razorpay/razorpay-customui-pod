# Deploy Custom Checkout


name: Deploy Custom Checkout

on:
  repository_dispatch:
    types: [deploy_customui_release]
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-custom-checkout-${{ github.event.pull_request.number || github.event.client_payload.custom_version || github.run_id }}
  cancel-in-progress: false

jobs:
# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Replace wrapper+core+custom, bump both podspecs, open ONE PR
# ─────────────────────────────────────────────────────────────────────────────
  deploy-customui:
    name: Deploy combined core + custom
    if: github.event_name == 'repository_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20

    env:
      CORE_CHANGED:        ${{ github.event.client_payload.core_changed }}
      CUSTOM_VERSION:      ${{ github.event.client_payload.custom_version }}
      CORE_VERSION:        ${{ github.event.client_payload.core_version }}
      IS_RC:               ${{ github.event.client_payload.is_rc }}
      ARTIFACT_REPOSITORY: ${{ github.event.client_payload.source_repo }}
      ARTIFACT_RUN_ID:     ${{ github.event.client_payload.run_id }}
      WRAPPER_ARTIFACT:    ${{ github.event.client_payload.artifacts.wrapper }}
      CORE_ARTIFACT:       ${{ github.event.client_payload.artifacts.core }}
      CUSTOM_ARTIFACT:     ${{ github.event.client_payload.artifacts.custom_sdk }}
      CHECKSUM_WRAPPER:    ${{ github.event.client_payload.checksums.wrapper }}
      CHECKSUM_CORE:       ${{ github.event.client_payload.checksums.core }}
      CHECKSUM_CUSTOM:     ${{ github.event.client_payload.checksums.custom_sdk }}

    steps:
      - name: Checkout master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          token: ${{ secrets.CI_BOT_TOKEN }}
          fetch-depth: 0

      - name: Validate dispatch payload
        run: |
          set -eo pipefail
          # Custom fields are always required. Core/wrapper fields are required only
          # when core actually changed (custom-only dispatches leave them empty).
          REQUIRED_VARS=(
            CUSTOM_VERSION ARTIFACT_REPOSITORY ARTIFACT_RUN_ID
            CUSTOM_ARTIFACT CHECKSUM_CUSTOM
          )
          if [ "${CORE_CHANGED}" = "true" ]; then
            REQUIRED_VARS+=(
              CORE_VERSION WRAPPER_ARTIFACT CORE_ARTIFACT
              CHECKSUM_WRAPPER CHECKSUM_CORE
            )
          fi
          for var_name in "${REQUIRED_VARS[@]}"; do
            [ -n "${!var_name}" ] || { echo "❌ Missing required payload field: ${var_name}"; exit 1; }
          done
          echo "Mode: core_changed=${CORE_CHANGED} (custom v${CUSTOM_VERSION}${CORE_VERSION:+ , core v${CORE_VERSION}})"

      - name: Create or reuse release branch
        run: |
          set -eo pipefail
          RELEASE_BRANCH="release/customui-${CUSTOM_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "${RELEASE_BRANCH}:${RELEASE_BRANCH}" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/heads/${RELEASE_BRANCH}"; then
            git checkout "${RELEASE_BRANCH}"
          else
            git checkout -b "${RELEASE_BRANCH}"
          fi

      - name: Download custom SDK XCFramework zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ secrets.CI_BOT_TOKEN }}
          repository: ${{ env.ARTIFACT_REPOSITORY }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          name: ${{ env.CUSTOM_ARTIFACT }}
          path: /tmp/artifacts/custom

      - name: Download wrapper XCFramework zip
        if: env.CORE_CHANGED == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ secrets.CI_BOT_TOKEN }}
          repository: ${{ env.ARTIFACT_REPOSITORY }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          name: ${{ env.WRAPPER_ARTIFACT }}
          path: /tmp/artifacts/wrapper

      - name: Download core XCFramework zip
        if: env.CORE_CHANGED == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ secrets.CI_BOT_TOKEN }}
          repository: ${{ env.ARTIFACT_REPOSITORY }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          name: ${{ env.CORE_ARTIFACT }}
          path: /tmp/artifacts/core

      - name: Verify checksums + replace xcframeworks
        run: |
          set -eo pipefail

          verify() {
            local dir="$1" zipname="$2" expected="$3" label="$4"
            local archive; archive=$(find "$dir" -name "$zipname" -type f | head -1)
            [ -n "$archive" ] || { echo "❌ ${label}: ${zipname} not found in ${dir}"; exit 1; }
            local actual; actual=$(shasum -a 256 "$archive" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "❌ ${label} checksum mismatch: expected ${expected}, got ${actual}"; exit 1; }
            printf '%s' "$archive"
          }

          replace() {
            local src_root="$1" name="$2" dest="$3"
            local src; src=$(find "$src_root" -name "${name}.xcframework" -type d | head -1)
            [ -n "$src" ] || { echo "❌ ${name}.xcframework not found in artifact"; exit 1; }
            rm -rf "$dest"
            cp -R "$src" "$dest"
            echo "✅ ${dest} replaced"
          }

          rm -rf /tmp/x && mkdir -p /tmp/x/custom

          # Custom always changes.
          CUSTOM_ZIP=$(verify /tmp/artifacts/custom sdk-xcframework.zip "${CHECKSUM_CUSTOM}" custom)
          unzip -q "$CUSTOM_ZIP" -d /tmp/x/custom
          replace /tmp/x/custom RazorpayCustom Pod/RazorpayCustom.xcframework

          # Wrapper + core only on a core change (custom-only leaves them pinned).
          if [ "${CORE_CHANGED}" = "true" ]; then
            mkdir -p /tmp/x/wrapper /tmp/x/core
            WRAPPER_ZIP=$(verify /tmp/artifacts/wrapper wrapper-xcframework.zip "${CHECKSUM_WRAPPER}" wrapper)
            CORE_ZIP=$(verify /tmp/artifacts/core core-xcframework.zip "${CHECKSUM_CORE}" core)
            unzip -q "$WRAPPER_ZIP" -d /tmp/x/wrapper
            unzip -q "$CORE_ZIP"    -d /tmp/x/core
            replace /tmp/x/wrapper Razorpay     Pod/core/Razorpay.xcframework
            replace /tmp/x/core    RazorpayCore Pod/core/RazorpayCore.xcframework
          else
            echo "ℹ️ custom-only — Pod/core/Razorpay.xcframework and Pod/core/RazorpayCore.xcframework left unchanged"
          fi

      - name: Bump podspecs (custom always; core + dependency on core change)
        env:
          TARGET_CORE_VERSION: ${{ env.CORE_VERSION }}
        run: |
          set -eo pipefail

          chmod +x .github/scripts/update_podspec_version.sh
          ./.github/scripts/update_podspec_version.sh "${CUSTOM_VERSION}"
          echo "✅ razorpay-customui-pod.podspec → v${CUSTOM_VERSION}"

          if [ "${CORE_CHANGED}" != "true" ]; then
            echo "ℹ️ custom-only — razorpay-core-pod.podspec + dependency left pinned to the last released core"
            exit 0
          fi

          # razorpay-core-pod.podspec version = the core version from the payload
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          v = os.environ["TARGET_CORE_VERSION"]
          p = Path("razorpay-core-pod.podspec"); t = p.read_text()
          n = re.sub(r"^(\s*s\.version\s*=\s*)'[^']+'", rf"\1'{v}'", t, count=1, flags=re.M)
          if n == t: raise SystemExit("Could not update razorpay-core-pod.podspec version")
          p.write_text(n)
          PY
          echo "✅ razorpay-core-pod.podspec → v${TARGET_CORE_VERSION}"

          # razorpay-customui-pod dependency 'razorpay-core-pod' → ~> core version
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          v = os.environ["TARGET_CORE_VERSION"]
          p = Path("razorpay-customui-pod.podspec"); t = p.read_text()
          dep = f"  s.dependency 'razorpay-core-pod', '~> {v}'"
          if "s.dependency 'razorpay-core-pod'" in t:
              t = re.sub(r"^[ \t]*s\.dependency 'razorpay-core-pod'.*$", dep, t, flags=re.M)
          else:
              needle = "s.vendored_frameworks = ['Pod/RazorpayCustom.xcframework']\n"
              if needle not in t: raise SystemExit("Could not locate vendored_frameworks line")
              t = t.replace(needle, needle + dep + "\n", 1)
          p.write_text(t)
          PY
          echo "✅ razorpay-customui-pod dependency → razorpay-core-pod ~> ${TARGET_CORE_VERSION}"

      - name: Refresh Example app pods
        run: |
          set -eo pipefail
          cat > Example/Podfile <<'PODFILE'
          use_frameworks!

          platform :ios, '11.0'

          target 'razorpay-customui-pod_Example' do
            pod 'razorpay-customui-pod', :path=>'../'
            pod 'razorpay-core-pod', :path=>'../'
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['EXCLUDED_ARCHS[sdk=iphonesimulator*]'] = 'arm64'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '11.0'
              end
            end
          end
          PODFILE
          rm -rf Example/Pods Example/Podfile.lock
          (cd Example && pod install --no-repo-update)
          echo "✅ Example pods refreshed"

      - name: Commit and push
        run: |
          set -eo pipefail
          RELEASE_BRANCH="release/customui-${CUSTOM_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Core paths are always add'd; when custom-only they carry no diff so
          # nothing extra is staged.
          git add Pod/RazorpayCustom.xcframework Pod/core/Razorpay.xcframework Pod/core/RazorpayCore.xcframework \
                  razorpay-core-pod.podspec razorpay-customui-pod.podspec \
                  Example/Podfile Example/Podfile.lock Example/Pods
          if git diff --cached --quiet; then
            echo "No release changes to commit"; exit 0
          fi
          if [ "${CORE_CHANGED}" = "true" ]; then
            git commit -m "chore: release customui:${CUSTOM_VERSION} + core:${CORE_VERSION}"
          else
            git commit -m "chore: release customui:${CUSTOM_VERSION}"
          fi
          git push origin "${RELEASE_BRANCH}"

      - name: Create pull request
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          set -eo pipefail
          RELEASE_BRANCH="release/customui-${CUSTOM_VERSION}"

          if [ "${CORE_CHANGED}" = "true" ]; then
            PR_TITLE="release: customui v${CUSTOM_VERSION} + core v${CORE_VERSION}"
            PR_BODY=$(cat <<EOF_BODY
          ## Custom + Core release — customui v${CUSTOM_VERSION}, core v${CORE_VERSION}

          ### Updated frameworks
          - \`Pod/RazorpayCustom.xcframework\` (custom)
          - \`Pod/core/Razorpay.xcframework\` (wrapper)
          - \`Pod/core/RazorpayCore.xcframework\` (core)

          ### Podspecs
          - \`razorpay-customui-pod.podspec\` → \`${CUSTOM_VERSION}\`
          - \`razorpay-core-pod.podspec\` → \`${CORE_VERSION}\`
          - dependency \`razorpay-core-pod\` → \`~> ${CORE_VERSION}\`

          Merging this releases BOTH \`core-${CORE_VERSION}\` and \`${CUSTOM_VERSION}\`.
          \`pod trunk push\` is MANUAL.

          ---
          Opened automatically by CI.
          EOF_BODY
          )
          else
            PR_TITLE="release: customui v${CUSTOM_VERSION}"
            PR_BODY=$(cat <<EOF_BODY
          ## Custom release — customui v${CUSTOM_VERSION}

          ### Updated frameworks
          - \`Pod/RazorpayCustom.xcframework\` (custom)

          ### Podspecs
          - \`razorpay-customui-pod.podspec\` → \`${CUSTOM_VERSION}\`
          - \`razorpay-core-pod\` dependency unchanged (pinned to the last released core)

          Merging this releases \`${CUSTOM_VERSION}\`. \`pod trunk push\` is MANUAL.

          ---
          Opened automatically by CI.
          EOF_BODY
          )
          fi

          HTTP_STATUS=$(curl --silent --output /tmp/pr_response.json --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/razorpay/razorpay-customui-pod/pulls" \
            -d "$(jq -n \
              --arg title "$PR_TITLE" \
              --arg body "$PR_BODY" \
              --arg head "$RELEASE_BRANCH" \
              --arg base "master" \
              '{title: $title, body: $body, head: $head, base: $base}')")

          if [ "$HTTP_STATUS" -eq 201 ]; then
            echo "✅ PR created: $(jq -r '.html_url' /tmp/pr_response.json)"
          elif [ "$HTTP_STATUS" -eq 422 ]; then
            echo "⚠️  PR already exists"
            jq -r '.errors[0].message // .message' /tmp/pr_response.json
          else
            echo "❌ Failed to create PR (HTTP ${HTTP_STATUS})"
            cat /tmp/pr_response.json
            exit 1
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Deploy customui v${CUSTOM_VERSION}"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Mode | core_changed=${CORE_CHANGED} |"
            echo "| Custom version | \`${CUSTOM_VERSION}\` |"
            echo "| RC | ${IS_RC} |"
            if [ "${CORE_CHANGED}" = "true" ]; then
              echo "| Core version | \`${CORE_VERSION}\` |"
              echo "| Frameworks replaced | RazorpayCustom + Razorpay (wrapper) + RazorpayCore |"
              echo "| On merge | releases core-${CORE_VERSION} AND ${CUSTOM_VERSION} |"
            else
              echo "| Core version | unchanged (dependency stays pinned) |"
              echo "| Frameworks replaced | RazorpayCustom only |"
              echo "| On merge | releases ${CUSTOM_VERSION} |"
            fi
            echo "| PR | ONE PR opened to master |"
          } >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — On the combined PR merge to master: tag + release BOTH core and custom
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Tag + release core and custom
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      startsWith(github.event.pull_request.head.ref, 'release/customui-') &&
      startsWith(github.event.pull_request.title, 'release: customui v') &&
      contains(github.event.pull_request.body || '', 'Opened automatically by CI.')
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout merged release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.CI_BOT_TOKEN }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read versions from podspecs
        id: v
        run: |
          set -eo pipefail
          CUSTOM_VERSION=$(grep -m1 "s\.version" razorpay-customui-pod.podspec | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ "'"'"']*' | head -1)
          CORE_VERSION=$(grep -m1 "s\.version" razorpay-core-pod.podspec | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ "'"'"']*' | head -1)
          [ -n "${CUSTOM_VERSION}" ] || { echo "❌ could not read customui version"; exit 1; }
          [ -n "${CORE_VERSION}" ] || { echo "❌ could not read core version"; exit 1; }
          {
            echo "custom_version=${CUSTOM_VERSION}"
            echo "core_version=${CORE_VERSION}"
            echo "custom_tag=${CUSTOM_VERSION}"
            echo "core_tag=core-${CORE_VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "custom=${CUSTOM_VERSION}  core=core-${CORE_VERSION}"

      - name: Tag + release core and custom
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CUSTOM_VERSION: ${{ steps.v.outputs.custom_version }}
          CORE_VERSION:   ${{ steps.v.outputs.core_version }}
          CUSTOM_TAG:     ${{ steps.v.outputs.custom_tag }}
          CORE_TAG:       ${{ steps.v.outputs.core_tag }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin

          # Create a tag + GitHub Release (idempotent, prerelease for -rc).
          release_one() {
            local tag="$1" name="$2" version="$3"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "ℹ️ tag ${tag} already exists"
            else
              git tag -a "${tag}" -m "${name}"
              git push origin "${tag}"
              echo "✅ tagged ${tag}"
            fi

            local prerelease=false
            [[ "${version}" == *"-rc"* ]] && prerelease=true

            local status
            status=$(curl --silent --output /tmp/rel.json --write-out "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/razorpay/razorpay-customui-pod/releases" \
              -d "$(jq -n --arg tag_name "${tag}" --arg name "${name}" --arg target "${MERGE_SHA}" \
                    --argjson prerelease ${prerelease} --argjson generate_release_notes true \
                    '{tag_name:$tag_name, name:$name, target_commitish:$target, prerelease:$prerelease, generate_release_notes:$generate_release_notes}')")
            if [ "${status}" -eq 201 ]; then echo "✅ released ${tag}";
            elif [ "${status}" -eq 422 ]; then echo "ℹ️ release ${tag} already exists";
            else echo "❌ failed to release ${tag} (HTTP ${status})"; cat /tmp/rel.json; exit 1; fi
          }

          # Core first (it's the dependency), then custom.
          release_one "${CORE_TAG}"   "Core ${CORE_VERSION}"           "${CORE_VERSION}"
          release_one "${CUSTOM_TAG}" "Custom Checkout ${CUSTOM_VERSION}" "${CUSTOM_VERSION}"

      - name: Validate podspecs (CocoaPods publish is MANUAL)
        env:
          CUSTOM_VERSION: ${{ steps.v.outputs.custom_version }}
          CORE_VERSION:   ${{ steps.v.outputs.core_version }}
        run: |
          set -eo pipefail
          # Lint only — publishing is MANUAL. CI does not run `pod trunk push`.
          # customui lint resolves its core dependency from the LOCAL core podspec
          # (core isn't on trunk yet — that push is manual too).
          pod lib lint razorpay-core-pod.podspec --allow-warnings || true
          pod lib lint razorpay-customui-pod.podspec --include-podspecs='razorpay-core-pod.podspec' --allow-warnings || true

          echo "ℹ️ MANUAL steps remaining (in order):"
          echo "   pod trunk push razorpay-core-pod.podspec --allow-warnings"
          echo "   pod trunk push razorpay-customui-pod.podspec --allow-warnings"

      - name: Job summary
        if: always()
        env:
          CUSTOM_VERSION: ${{ steps.v.outputs.custom_version }}
          CORE_VERSION:   ${{ steps.v.outputs.core_version }}
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Core | \`core-${CORE_VERSION}\` ensured (created on a core change; no-op when custom-only) |"
            echo "| CustomUI | \`${CUSTOM_VERSION}\` released |"
            echo "| CocoaPods | manual — pod trunk push (core if new, then custom) |"
          } >> "$GITHUB_STEP_SUMMARY"
